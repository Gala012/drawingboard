name: drawing_board
description: "Portable painting studio — local drawing board."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.3
  get_storage: ^2.1.1
  sqflite: ^2.4.2
  flutter_inappwebview: ^6.1.5
  path_provider: ^2.1.5
  flutter_timezone: ^3.0.0
  device_info_plus: ^10.1.0
  path: ^1.9.1
  share_plus: ^11.0.0
  package_info_plus: ^8.0.0
  image: ^4.5.4
  dio: ^5.4.3+1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0


  # flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  image_path: "assets/121.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/121.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/trace/
    - assets/trace/trace_manifest.json
    # Directory entries are not recursive: images in subfolders must each be listed.
    - assets/trace/gufeng_lineart/
